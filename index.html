<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>双色球智能选号 · 走势分析</title>
<style>
  :root {
    --bg: #0b1020; --bg2: #0f1629; --panel: rgba(255,255,255,.045);
    --panel-strong: rgba(255,255,255,.07); --border: rgba(255,255,255,.1);
    --text: #e7ecf5; --muted: #9aa7bd; --red: #ef4444; --blue: #3b82f6;
    --accent: #8b5cf6; --hot: #f87171; --warm: #fbbf24; --cold: #60a5fa;
    --shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  [data-theme="light"] {
    --bg: #eef1f8; --bg2: #e3e8f5; --panel: rgba(255,255,255,.72);
    --panel-strong: rgba(255,255,255,.9); --border: rgba(15,23,42,.1);
    --text: #0f172a; --muted: #5b6b86; --red: #dc2626; --blue: #2563eb;
    --accent: #7c3aed; --hot: #ef4444; --warm: #d97706; --cold: #2563eb;
    --shadow: 0 10px 40px rgba(30,41,59,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: radial-gradient(1200px 600px at 80% -10%, var(--bg2), var(--bg));
    min-height: 100vh; overflow-x: hidden; transition: background .4s ease, color .3s ease;
  }
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5; }
  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--red), var(--blue)); font-weight: 800; color: #fff;
    box-shadow: var(--shadow); font-size: 18px;
  }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: .5px; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .theme-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 9px 14px; border-radius: 12px; cursor: pointer; font-size: 13px;
    transition: transform .2s, background .2s;
  }
  .theme-btn:hover { transform: translateY(-1px); background: var(--panel-strong); }

  .disclaimer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 22px; line-height: 1.6;
  }
  .disclaimer b { color: var(--warm); }

  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; backdrop-filter: blur(14px); box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* 策略选择 */
  .strategies { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .strat {
    border: 1px solid var(--border); background: var(--panel-strong); color: var(--text);
    padding: 12px 10px; border-radius: 13px; cursor: pointer; text-align: center;
    transition: all .22s cubic-bezier(.16,1,.3,1); font-size: 13px;
  }
  .strat .t { font-weight: 700; }
  .strat .d { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .strat:hover { transform: translateY(-2px); border-color: var(--accent); }
  .strat.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(139,92,246,.22), rgba(59,130,246,.16)); box-shadow: 0 6px 22px rgba(139,92,246,.28); }

  /* 注数 */
  .field { margin-bottom: 20px; }
  .field label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--panel-strong); color: var(--text); font-size: 20px; cursor: pointer; transition: .2s;
  }
  .stepper button:hover { border-color: var(--accent); }
  .stepper input {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700; padding: 8px;
    border-radius: 11px; border: 1px solid var(--border); background: var(--panel-strong); color: var(--text);
  }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel-strong); color: var(--muted);
    padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: .2s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }

  .gen-btn {
    width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
    font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--red), var(--blue)); box-shadow: var(--shadow);
    transition: transform .2s, filter .2s; margin-top: 4px;
  }
  .gen-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .gen-btn:disabled { opacity: .6; cursor: progress; transform: none; }
  .row2 { display: flex; gap: 10px; margin-top: 12px; }
  .ghost-btn {
    flex: 1; padding: 11px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
    background: var(--panel); color: var(--text); font-size: 13px; transition: .2s;
  }
  .ghost-btn:hover { background: var(--panel-strong); border-color: var(--accent); }

  /* 走势 */
  .section-title { font-size: 13px; color: var(--muted); margin: 18px 0 10px; }
  .balls { display: flex; flex-wrap: wrap; gap: 6px; }
  .ball {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; cursor: default; border: 1px solid var(--border);
    transition: transform .15s;
  }
  .ball:hover { transform: scale(1.12); }
  .ball.red { background: var(--red); color: #fff; border-color: transparent; }
  .ball.blue { background: var(--blue); color: #fff; border-color: transparent; }
  .ball.hot { box-shadow: 0 0 0 2px var(--hot) inset; }
  .ball.cold { box-shadow: 0 0 0 2px var(--cold) inset; }

  .trend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rank-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .rank-item {
    display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 9px;
    border-radius: 9px; background: var(--panel-strong); border: 1px solid var(--border);
  }
  .rank-item .num { font-weight: 800; color: var(--accent); }
  .rank-item.hot .num { color: var(--hot); }
  .rank-item.cold .num { color: var(--cold); }

  .zone { margin-bottom: 10px; }
  .zone .lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bar { height: 9px; border-radius: 999px; background: var(--panel-strong); overflow: hidden; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--red), var(--blue)); }

  /* 结果 */
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 560px) { .results { grid-template-columns: 1fr; } }
  .ticket {
    background: var(--panel-strong); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px;
    display: flex; align-items: center; gap: 9px; opacity: 0; transform: translateY(10px);
    animation: pop .45s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes pop { to { opacity: 1; transform: translateY(0); } }
  .ticket .idx { font-size: 12px; color: var(--muted); width: 22px; flex-shrink: 0; }
  .ticket .nums { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
  .nb {
    width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .nb.r { background: var(--red); }
  .nb.b { background: var(--blue); }
  .plus { color: var(--muted); font-weight: 800; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .status { font-size: 12.5px; color: var(--muted); margin-top: 12px; min-height: 18px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">双</div>
      <div>
        <h1>双色球智能选号</h1>
        <p>走势分析 · 随机/加权生成 · 指定注数</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn">🌗 切换主题</button>
  </div>

  <div class="disclaimer">
    <b>理性购彩提示：</b>双色球每期开奖是独立随机过程，历史走势不影响未来结果。本工具仅为按统计偏好生成号码的娱乐参考，<b>不保证中奖</b>。请量力而行。
  </div>

  <div class="grid">
    <!-- 控制面板 -->
    <div class="card">
      <h2><span class="dot"></span>选号设置</h2>
      <div class="strategies" id="strategies">
        <div class="strat active" data-s="random"><div class="t">🎲 纯随机</div><div class="d">完全随机</div></div>
        <div class="strat" data-s="hot"><div class="t">🔥 追热</div><div class="d">高频优先</div></div>
        <div class="strat" data-s="cold"><div class="t">❄️ 博冷</div><div class="d">高遗漏优先</div></div>
        <div class="strat" data-s="balanced"><div class="t">⚖️ 均衡</div><div class="d">冷热兼顾</div></div>
      </div>

      <div class="field">
        <label>生成注数（1–200）</label>
        <div class="stepper">
          <button id="minus">−</button>
          <input id="count" type="number" min="1" max="200" value="5" />
          <button id="plus">＋</button>
        </div>
        <div class="opts" id="quick">
          <span class="chip" data-n="1">1</span>
          <span class="chip" data-n="5">5</span>
          <span class="chip" data-n="10">10</span>
          <span class="chip" data-n="20">20</span>
          <span class="chip" data-n="50">50</span>
        </div>
      </div>

      <button class="gen-btn" id="genBtn">生 成 号 码</button>
      <div class="row2">
        <button class="ghost-btn" id="refreshBtn">🔄 更新数据</button>
        <button class="ghost-btn" id="copyBtn">📋 复制结果</button>
      </div>
      <div class="status" id="status">就绪。</div>
    </div>

    <!-- 走势 + 结果 -->
    <div>
      <div class="card" style="margin-bottom:22px;">
        <h2><span class="dot"></span>走势分析 <span id="trendN" style="color:var(--muted);font-weight:400;font-size:12px;"></span></h2>
        <div class="trend-grid">
          <div>
            <div class="section-title">红球热号 Top10</div>
            <div class="rank-list" id="hotRed"></div>
            <div class="section-title">红球冷号 Top10（高遗漏）</div>
            <div class="rank-list" id="coldRed"></div>
          </div>
          <div>
            <div class="section-title">红球区间分布</div>
            <div id="zones"></div>
            <div class="section-title">蓝球热度</div>
            <div class="balls" id="blueBalls"></div>
          </div>
        </div>
        <div class="section-title">红球走势（颜色越红越热 · 蓝边为冷号）</div>
        <div class="balls" id="redBalls"></div>
      </div>

      <div class="card">
        <h2><span class="dot"></span>生成结果</h2>
        <div id="results"><div class="empty">点击「生成号码」查看结果</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let currentStrategy = 'random';
let lastNumbers = [];

/* ---------- 主题 ---------- */
const themeBtn = $('#themeBtn');
const savedTheme = localStorage.getItem('ssq-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ssq-theme', next);
};

/* ---------- 策略选择 ---------- */
$('#strategies').addEventListener('click', (e) => {
  const el = e.target.closest('.strat'); if (!el) return;
  document.querySelectorAll('.strat').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  currentStrategy = el.dataset.s;
});

/* ---------- 注数 ---------- */
const countEl = $('#count');
$('#minus').onclick = () => setCount(Math.max(1, (+countEl.value || 1) - 1));
$('#plus').onclick = () => setCount(Math.min(200, (+countEl.value || 1) + 1));
$('#quick').addEventListener('click', (e) => { if (e.target.dataset.n) setCount(+e.target.dataset.n); });
countEl.oninput = () => { let v = Math.max(1, Math.min(200, +countEl.value || 1)); };
function setCount(n) { countEl.value = n; }

/* ---------- 走势 ---------- */
async function loadTrend() {
  try {
    const r = await fetch('/api/trend'); const d = await r.json();
    if (!d.ok) { $('#trendN').textContent = '（数据加载失败）'; return; }
    $('#trendN').textContent = `· 基于 ${d.n} 期历史`;
    $('#hotRed').innerHTML = d.hot.map(([n,c]) => `<div class="rank-item hot"><span class="num">${pad(n)}</span><span>出现${c}次</span></div>`).join('');
    $('#coldRed').innerHTML = d.cold.map(([n,o]) => `<div class="rank-item cold"><span class="num">${pad(n)}</span><span>遗漏${o}期</span></div>`).join('');
    $('#zones').innerHTML = Object.entries(d.zones).map(([k,v]) =>
      `<div class="zone"><div class="lab"><span>${k}</span><span>${(v*100).toFixed(0)}%</span></div><div class="bar"><i style="width:${(v*100).toFixed(1)}%"></i></div></div>`).join('');
    $('#blueBalls').innerHTML = Object.entries(d.blue).map(([n,info]) => {
      const cls = info.omission >= 8 ? 'cold' : (info.freq >= 8 ? 'hot' : '');
      return `<div class="ball blue ${cls}" title="蓝球${pad(n)} 出现${info.freq}次 遗漏${info.omission}期">${pad(n)}</div>`;
    }).join('');
    $('#redBalls').innerHTML = Object.entries(d.red).map(([n,info]) => {
      const cls = info.tier === '热' ? 'hot' : (info.tier === '冷' ? 'cold' : '');
      return `<div class="ball red ${cls}" title="红球${pad(n)} 出现${info.freq}次 遗漏${info.omission}期">${pad(n)}</div>`;
    }).join('');
  } catch (e) { $('#trendN').textContent = '（加载出错）'; }
}
function pad(n) { return String(n).padStart(2, '0'); }

/* ---------- 生成 ---------- */
$('#genBtn').onclick = async () => {
  const btn = $('#genBtn'); btn.disabled = true; btn.textContent = '生成中…';
  $('#status').textContent = '正在生成…';
  try {
    const r = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strategy: currentStrategy, count: +countEl.value, dedupe: true })
    });
    const d = await r.json();
    if (!d.ok) { $('#status').textContent = '错误：' + d.error; return; }
    lastNumbers = d.numbers;
    renderResults(d.numbers);
    const label = {random:'纯随机',hot:'追热',cold:'博冷',balanced:'冷热均衡'}[d.strategy];
    $('#status').textContent = `已生成 ${d.count} 注（策略：${label}）`;
  } catch (e) {
    $('#status').textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '生 成 号 码';
  }
};

function renderResults(nums) {
  const box = $('#results');
  if (!nums.length) { box.innerHTML = '<div class="empty">无结果</div>'; return; }
  box.innerHTML = '<div class="results">' + nums.map((item, i) => {
    const reds = item.reds.map(n => `<span class="nb r">${pad(n)}</span>`).join('');
    return `<div class="ticket" style="animation-delay:${i*45}ms">
      <span class="idx">${i+1}</span>
      <div class="nums">${reds}<span class="plus">+</span><span class="nb b">${pad(item.blue)}</span></div>
    </div>`;
  }).join('') + '</div>';
}

/* ---------- 复制 ---------- */
$('#copyBtn').onclick = () => {
  if (!lastNumbers.length) { $('#status').textContent = '还没有结果可复制'; return; }
  const text = lastNumbers.map((it, i) => `${i+1}. ${it.reds.map(pad).join(' ')} + ${pad(it.blue)}`).join('\n');
  navigator.clipboard.writeText(text).then(() => $('#status').textContent = '已复制到剪贴板 ✓').catch(() => $('#status').textContent = '复制失败');
};

/* ---------- 更新数据 ---------- */
$('#refreshBtn').onclick = async () => {
  $('#status').textContent = '正在刷新最新开奖数据…';
  try {
    const r = await fetch('/api/refresh'); const d = await r.json();
    if (d.ok) { $('#status').textContent = `数据已更新，共 ${d.count} 期`; loadTrend(); }
    else $('#status').textContent = '刷新失败：' + d.error;
  } catch (e) { $('#status').textContent = '刷新出错：' + e.message; }
};

/* ---------- 粒子背景 ---------- */
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('bg-canvas'); const ctx = c.getContext('2d');
  let w, h, parts;
  function resize() { w = c.width = innerWidth; h = c.height = innerHeight;
    parts = Array.from({length: 46}, () => ({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8+.4, vx: (Math.random()-.5)*.25, vy: (Math.random()-.5)*.25 })); }
  resize(); addEventListener('resize', resize);
  (function loop() {
    ctx.clearRect(0,0,w,h);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#8b5cf6';
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fillStyle = accent; ctx.globalAlpha = .35; ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

loadTrend();
</script>
</body>
</html>
